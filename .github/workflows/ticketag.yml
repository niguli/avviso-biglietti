name: Ticketag Sampdoria

on:
  schedule:
    - cron: "*/5 * * * *"    # ogni 5 minuti (il minimo consentito da GitHub)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticketag
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Controlla i biglietti
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Sampdoria – Benevento, sabato 21 novembre ore 15:00
          EVENT_IDS: "e1f0aaf5-dc30-4156-8b72-7ddea18c0a43"
        run: python ticketag_monitor.py
      - name: Salva lo stato
        if: always()
        run: |
          git config user.name "web-monitor"
          git config user.email "web-monitor@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Aggiorna stato biglietti"
          git pull --rebase -q || true
          git push
